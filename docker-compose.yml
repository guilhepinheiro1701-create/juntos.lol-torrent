# juntos.lol, inteiro na sua máquina.
#
# O upstream depende de um bucket R2 (Cloudflare) para os segmentos HLS. Isso
# sai de graça: o servidor fala S3 genérico pelo cliente minio-go, e
# `R2_ENDPOINT` existe justamente para apontá-lo para outro lugar
# (internal/objectstore/r2.go). Então o R2 vira um MinIO aqui do lado, e nada
# nesta pilha sai da sua rede além dos torrents e do catálogo.
#
# Não use isto na internet. Tudo publica em 127.0.0.1 de propósito, não há TLS
# e o worker roda em HTTP puro.
#
# Este e o arquivo padrao desta ramificacao de proposito: qualquer coisa que
# rode "docker compose up" — a linha de comando, o botao do Docker Desktop, o
# VS Code — cai aqui, e nao na versao de nuvem, que precisa de credenciais da
# Cloudflare e nao tem como funcionar na sua maquina. A de nuvem ficou em
# docker-compose.cloud.yml, para referencia.
#
# Uso:  setup.bat / ./setup.sh uma vez, depois start.bat / ./start.sh

name: juntos-local

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WEB_DIR: /web
      GIN_MODE: release

      # O bucket. R2_ACCOUNT_ID só precisa não estar vazio: com R2_ENDPOINT
      # definido, o account id deixa de compor o endereço e vira enfeite.
      R2_ACCOUNT_ID: local
      R2_BUCKET: ${MINIO_BUCKET:-juntos}
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?rode o setup primeiro}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?rode o setup primeiro}
      R2_ENDPOINT: ${S3_HOST:-juntos-minio}:9000
      R2_INSECURE: "1"

      # De onde o NAVEGADOR baixa os segmentos. Precisa ser o mesmo nome do
      # R2_ENDPOINT: a assinatura SigV4 inclui o Host, então um endereço aqui
      # e outro lá dá 403 no PUT.
      MEDIA_PUBLIC_URL: http://${S3_HOST:-juntos-minio}:9000/${MINIO_BUCKET:-juntos}

      PUBLIC_ORIGIN: http://localhost:8099
      ROOM_TTL_HOURS: ${ROOM_TTL_HOURS:-5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-51200}

      # O worker abaixo só entra na frota com este segredo definido.
      WORKER_ENROLLMENT_SECRET: ${WORKER_ENROLLMENT_SECRET:?rode o setup primeiro}
      WORKER_SIGNING_KEY_FILE: /data/worker-signing.key

      # Saída para os plugins de fonte. Deixe vazio; só serve se algum addon
      # recusar o seu IP.
      PLUGIN_FETCH_PROXY: ${PLUGIN_FETCH_PROXY:-}
    # O nome do MinIO tem de resolver igual dentro do container e no navegador.
    # Dentro, vai para o gateway do host, onde a porta 9000 está publicada.
    extra_hosts:
      - "${S3_HOST:-juntos-minio}:host-gateway"
    volumes:
      - juntos-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy volatile-ttl
    volumes:
      - juntos-redis:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?rode o setup primeiro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?rode o setup primeiro}
      # O navegador faz PUT dos segmentos direto no bucket, de outra origem.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8099"
    ports:
      - "127.0.0.1:9000:9000"   # a API S3, que é a que o navegador usa
      - "127.0.0.1:9001:9001"   # console web, opcional
    volumes:
      - juntos-minio:/data

  # Cria o bucket e o deixa de leitura anônima: as playlists saem do servidor,
  # mas os segmentos o navegador busca direto do bucket, sem assinatura.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    # Espera o MinIO por conta própria, em vez de depender de um healthcheck
    # que assume um `mc` pronto dentro da imagem do servidor.
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" 2>/dev/null; do
        echo 'esperando o MinIO...'; sleep 2;
      done &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET &&
      echo \"bucket $$MINIO_BUCKET pronto\"
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?rode o setup primeiro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?rode o setup primeiro}
      MINIO_BUCKET: ${MINIO_BUCKET:-juntos}

  # Os torrents. Sem ele o catálogo abre e nada toca, então sobe junto.
  worker:
    build:
      context: ./ss-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 50m, max-file: "3" }
    environment:
      SS_WORKER_SERVER_URL: ws://app:8080/ws/worker-link
      SS_WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_SECRET:?rode o setup primeiro}
      SS_WORKER_DATA_DIR: /var/lib/ss-worker
      # Sem domínio público não há ACME. Em HTTP puro o navegador não reclama,
      # porque a própria página está em http://localhost.
      SS_WORKER_TLS: "off"
      SS_WORKER_PUBLIC_HOSTNAME: localhost
      SS_WORKER_HTTP_ADDR: "[::]:8081"
      SS_WORKER_BT_PORT: "4240"
      SS_WORKER_DISK_QUOTA_GB: ${WORKER_DISK_QUOTA_GB:-35}
      SS_WORKER_MAX_LEASES: ${WORKER_MAX_LEASES:-8}
      SS_WORKER_RELAY_UPSTREAM: http://app:8080
      # Mais de um disco? Veja WORKER_STORAGE_DIRS no .env.local. Cada caminho
      # aqui é de dentro do container, então precisa vir montado em `volumes`.
      SS_WORKER_STORAGE_DIRS: ${WORKER_STORAGE_DIRS:-}
    ports:
      - "127.0.0.1:8081:8081"
      # Esta o roteador precisa deixar entrar para o torrent pegar peers.
      - "4240:4240"
      - "4240:4240/udp"
    volumes:
      - juntos-worker:/var/lib/ss-worker
    depends_on:
      - app

volumes:
  juntos-data:
  juntos-redis:
  juntos-minio:
  juntos-worker:
